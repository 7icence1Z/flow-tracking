<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FLOW · 流量出口</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0c0e'/%3E%3Cpath d='M13 46 L27 31 L37 39 L51 17' stroke='%23d99a4e' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='51' cy='17' r='5' fill='%23d99a4e'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0e; --panel:#111417; --panel-2:#181c21;
  --line:#1f242b; --line-2:#2e353f;
  --text:#dfe3e8; --dim:#9aa3af; --dim-2:#77808d;
  --accent:#d99a4e; --accent-2:#5d4a30; --bad:#c96a5f;
  --vpn:#d99a4e; --dir:#5fada5; --ok:#5fada5; --ok-2:#3d6266;
  --prox:#8e97a8;   /* "进了客户端"的入口字节：中性色，不冒充走 VPN 的琥珀 */
  --dn:#dfe3e8; --up:#7d949c;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif;
  --r:5px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:12.5px/1.5 var(--ui);
  -webkit-font-smoothing:antialiased;
  padding:8px;
}
.app{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;max-width:940px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 11px;min-width:0}

/* ── 头部 ───────────────────────────────── */
.head{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 2px 0}
.brand{display:flex;align-items:baseline;gap:8px;margin:0;font-weight:400}
.brand b{font-size:12.5px;letter-spacing:.16em;font-weight:650;color:#f0f2f5}
.brand small{color:var(--dim-2);font-size:10.5px}
.verdict{display:inline-flex;align-items:center;gap:7px;padding:0;border:0;background:none;
  font-size:13px;font-weight:600;color:var(--text);white-space:nowrap}
.verdict .dot{width:6px;height:6px;border-radius:50%;background:var(--dim-2);flex:none}
.verdict[data-s="vpn"] .dot,.verdict[data-s="mixed"] .dot{background:var(--accent)}
.verdict[data-s="vpn"]{color:#e4c69b}
.verdict[data-s="mixed"]{color:#d8c3a3}
.verdict[data-s="direct"]{color:#bdd8d4}
.verdict[data-s="down"]{color:#e0b0a9}
.verdict[data-s="direct"] .dot{background:var(--ok)}
.verdict[data-s="down"] .dot{background:var(--bad)}
.verdict small{font-weight:400;color:var(--dim);font-size:11px;letter-spacing:0}
.grow{flex:1}
.clock{display:flex;align-items:baseline;gap:9px;font-family:var(--mono);font-size:10.5px;color:var(--dim-2)}
.clock b{color:var(--dim);font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums}
/* 采集器掉线时别让上一帧的判定继续冒充"现在" */
.linkstale{
  font:10.5px/1 var(--mono);color:#dda79f;letter-spacing:.02em;white-space:nowrap;
  border:1px solid rgba(201,106,95,.42);background:rgba(201,106,95,.10);
  padding:3px 8px;border-radius:99px;
}
body.stale .verdict{opacity:.55}
body.stale .rates,body.stale .totals{opacity:.7}

h2{margin:0;font-size:11.5px;font-weight:500;color:var(--dim);letter-spacing:.02em}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.card-head .note{color:var(--dim-2);font-size:10.5px;font-family:var(--mono)}

/* ── 路径 ───────────────────────────────── */
.route{grid-column:1/-1}
.lanes{display:grid;gap:0}
.lane{
  border:0;border-top:1px solid var(--line);border-left:2px solid #20262e;
  border-radius:0;padding:5px 0 6px 9px;background:none;
}
.lane:first-child{border-top:0}
.lane[data-active="false"]{opacity:.55}
.lane[data-active="true"][data-kind="vpn"]{border-left-color:var(--accent)}
.lane[data-active="true"][data-kind="direct"]{border-left-color:var(--dir)}
.lane[data-active="true"][data-kind="vpn"]{background:rgba(217,154,78,.035)}
.lane[data-active="true"][data-kind="direct"]{background:rgba(87,160,154,.035)}
.lane[data-active="true"][data-kind="vpn"] .lane-title{color:#dcc3a1}
.lane[data-active="true"][data-kind="direct"] .lane-title{color:#b3cdc8}
.lane-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.badge{font-size:10px;letter-spacing:.06em;font-weight:600;color:var(--dim);border:0;padding:0}
.badge::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--dim-2);margin-right:5px;vertical-align:1px}
.badge.vpn::before{background:var(--accent-2)}
.badge.direct::before{background:var(--ok-2)}
.lane[data-active="true"] .badge.vpn::before{background:var(--accent)}
.lane[data-active="true"] .badge.direct::before{background:var(--ok)}
.lane-title{font-size:11.5px;font-weight:500;letter-spacing:.01em;color:#c6ccd4}
.lane-meta{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim-2)}
.lane-meta .on{color:var(--dim)}
.lane-meta .off{color:var(--bad)}

.chain{display:flex;align-items:center;margin:0;padding:0;list-style:none;gap:0}
.node{min-width:0;flex:1 1 0;padding:0 4px;border-radius:0;background:none;border:0}
.node .k{display:block;font-size:9px;letter-spacing:.02em;color:var(--dim-2);margin-bottom:1px}
.node .v{display:block;font-family:var(--mono);font-size:10.5px;color:#ccd2d9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .v.ip{color:var(--text)}
#vpnNode{max-width:196px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{list-style:none;flex:0 0 18px;height:1px;background:var(--line-2);position:relative;margin:0 5px}
.link::after{
  content:"";position:absolute;right:0;top:-2px;width:4px;height:4px;
  border-right:1px solid var(--line-2);border-top:1px solid var(--line-2);
  transform:rotate(45deg);
}
.lane[data-active="true"][data-kind="vpn"] .link{background:var(--accent-2)}
.lane[data-active="true"][data-kind="vpn"] .link::after{border-color:var(--accent-2)}
.lane[data-active="true"][data-kind="direct"] .link{background:var(--ok-2)}
.lane[data-active="true"][data-kind="direct"] .link::after{border-color:var(--ok-2)}

/* ── 速率 ───────────────────────────────── */
.throughput{grid-column:span 7}
.probes{grid-column:span 5}
.rates{display:flex;gap:18px;align-items:flex-end;margin-bottom:2px}
.rate{min-width:0}
.rate .cap{font-size:9.5px;letter-spacing:.02em;color:var(--dim-2)}
.rate .val{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.rate.dn .val{font-size:19px;color:var(--text)}
.rate.up .val{font-size:14px;color:var(--up)}
.rate .unit{font-size:10.5px;color:var(--dim-2);margin-left:4px;letter-spacing:0}
.chart{position:relative;height:40px;margin:3px 0 2px}
.chart .scale{position:absolute;right:2px;top:-3px;font:9.5px/1 var(--mono);color:var(--dim-2)}
.sites-empty{padding:10px 2px 4px;font-size:10.5px;color:var(--dim-2)}
.chart svg{display:block;width:100%;height:100%}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim-2);
  border-top:1px solid var(--line);padding-top:5px;margin-top:2px}
.totals b{color:var(--dim);font-weight:400}

/* ── 探测 ───────────────────────────────── */
.prow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid #161a20;font-size:10.5px}
.prow:last-of-type{border-bottom:0}
.prow .nm{color:var(--dim);min-width:62px}
.prow .res{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--dim-2);border:0;padding:0;border-radius:0}
.pill.ok{color:var(--ok)}
.pill.bad{color:var(--bad)}
.pill.idle{color:var(--dim-2)}
/* 诊断结论：一句话说清"这次该怀疑谁"，颜色即严重程度 */
.dg{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);
  color:var(--dim-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.dg::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.9;flex:none}
.dg[data-s="idle"]::before{opacity:.35}
.dg[data-s="unknown"]::before{opacity:.5}
.dg[data-s="nopx"]{color:var(--dim)}
.dg[data-s="off"]{color:var(--dim)}
.dg[data-s="off"]::before{opacity:.5}
.dg[data-s="ok"]{color:var(--dir)}
.dg[data-s="target"]{color:var(--vpn)}
.dg[data-s="vpn"],.dg[data-s="link"],.dg[data-s="dns"],.dg[data-s="upstream"]{color:var(--bad)}
.strip{margin-top:6px}
.strip .lbl{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.02em;
  color:var(--dim-2);margin-bottom:3px}
.strip svg{display:block;width:100%;height:12px}

/* ── 站点 ───────────────────────────────── */
.sites{grid-column:1/-1}
.site{display:grid;grid-template-columns:150px minmax(0,1fr) 148px;
  align-items:center;gap:10px;padding:4px 0;border-top:1px solid #161a20}
.site:first-child{border-top:0}
.site-id{min-width:0;display:flex;align-items:center;gap:7px}
.site-name{font-family:var(--mono);font-size:11.5px;color:#d3d8df;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-sub{display:none}
.tag{font-size:9.5px;letter-spacing:.04em;font-weight:500;border:0;padding:0;flex:none;color:var(--dim-2)}
.tag[data-via="vpn"]{color:#c08b46}
.tag[data-via="direct"]{color:#4f8d88}
.tag[data-via="proxy"]{color:#8e97a8}
.tag[data-via="idle"]{color:var(--dim-2)}
.site-spark svg{display:block;width:100%;height:18px;overflow:visible}
.site-nums{display:flex;gap:10px;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
  white-space:nowrap;justify-content:flex-end}
.site-nums .n{display:inline-flex;align-items:baseline;gap:3px}
.site-nums .n.dn{color:var(--text)}
.site-nums .n.up{color:var(--up)}
.site-nums i{font-style:normal;font-size:9.5px;color:var(--dim-2)}
.site-nums .n.idle{color:var(--dim-2)}
.site-nums .u{font-size:9.5px;color:var(--dim-2);margin-left:1px}
.extras{margin-top:6px;border-top:1px solid var(--line);padding-top:6px;
  font-family:var(--mono);font-size:10.5px;color:var(--dim-2);display:flex;flex-wrap:wrap;gap:5px 14px}
.extras:empty{display:none}
.extras span b{color:var(--dim);font-weight:400}

footer{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10px;color:var(--dim-2);padding:1px 3px 2px}

/* ── 站点增删 ──────────────────────────── */
.sites-ops{display:flex;align-items:center;gap:9px}
.mini{font:inherit;font-size:10.5px;color:var(--dim);background:var(--panel-2);
  border:1px solid var(--line-2);border-radius:3px;padding:2px 7px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--text);border-color:#3a434f}
.site-form{margin:0 0 5px}
.site-form input{width:100%;font:11.5px/1.4 var(--mono);color:var(--text);background:#0b0e12;
  border:1px solid var(--line-2);border-radius:3px;padding:4px 8px}
.site-form input:focus{border-color:#4a5464;outline:2px solid #3d4757;outline-offset:0}
:where(button,input):focus-visible{outline:2px solid #55627a;outline-offset:1px}
.site-del{opacity:0;font:11.5px/1 var(--ui);color:var(--dim-2);background:none;border:0;
  cursor:pointer;padding:0 1px;flex:none}
.site:hover .site-del,.site-del:focus-visible{opacity:1}
.site-del:hover{color:var(--bad)}
.extras button{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);background:none;border:0;
  padding:0;cursor:pointer;display:inline-flex;align-items:baseline;gap:4px}
.extras button:hover{color:var(--text)}
.extras button b{color:var(--dim);font-weight:400}
.extras .ex-lbl{color:#3f4753}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);opacity:0;
  pointer-events:none;background:#161a20;border:1px solid var(--line-2);border-radius:3px;
  padding:5px 11px;font-size:11px;color:var(--text);transition:opacity .18s;z-index:9}
#toast.on{opacity:1}

@media (max-width:760px){
  .throughput,.probes{grid-column:1/-1}
}
@media (max-width:520px){
  body{padding:6px}
  .rate.dn .val{font-size:17px}
  .site{grid-template-columns:minmax(0,1fr) auto;gap:3px 10px}
  .site-spark{grid-column:1/-1;grid-row:2}
  .node{flex:none}
  .lane-meta{margin-left:0;flex-basis:100%;order:9}
  .rates{gap:14px}
  .chain{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chain .link{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <linearGradient id="gSite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" style="stop-color:var(--dn);stop-opacity:.20"/>
      <stop offset="100%" style="stop-color:var(--dn);stop-opacity:0"/>
    </linearGradient>
  </defs>
</svg>
<main class="app">

  <div class="head">
    <h1 class="brand"><b>FLOW</b><small>流量出口监视</small></h1>
    <div class="verdict" id="verdict" data-s="idle" aria-live="polite">
      <span class="dot"></span>
      <span id="verdictText">连接中…</span>
      <small id="verdictSub"></small>
    </div>
    <div class="grow"></div>
    <span class="linkstale" id="linkState" hidden>采集器未连接</span>
    <div class="clock"><b id="clock">--:--:--</b><span id="uptime"></span></div>
  </div>

  <section class="card route">
    <div class="card-head"><h2>出口路径</h2><span class="note" id="modeNote">—</span></div>

    <div class="lanes">
      <article class="lane" id="laneVpn" data-kind="vpn" data-active="false">
        <div class="lane-head">
          <span class="badge vpn">VPN</span>
          <span class="lane-title">代理隧道</span>
          <span class="lane-meta" id="vpnMeta">—</span>
        </div>
        <ol class="chain">
          <li class="node"><span class="k">本机</span><span class="v" id="vpnLocal">—</span></li>
          <li class="link"></li>
          <li class="node"><span class="k">网卡</span><span class="v" id="vpnNic">—</span></li>
          <li class="link"></li>
          <li class="node"><span class="k">节点</span><span class="v" id="vpnNode">—</span></li>
          <li class="link"></li>
          <li class="node"><span class="k">出口</span><span class="v ip" id="vpnExit">—</span></li>
        </ol>
      </article>

      <article class="lane" id="laneDirect" data-kind="direct" data-active="false">
        <div class="lane-head">
          <span class="badge direct">直连</span>
          <span class="lane-title">不经代理</span>
          <span class="lane-meta" id="dirMeta">—</span>
        </div>
        <ol class="chain">
          <li class="node"><span class="k">本机</span><span class="v" id="dirLocal">—</span></li>
          <li class="link"></li>
          <li class="node"><span class="k">网卡</span><span class="v" id="dirNic">—</span></li>
          <li class="link"></li>
          <li class="node"><span class="k">出口</span><span class="v ip" id="dirExit">—</span></li>
        </ol>
      </article>
    </div>

  </section>

  <section class="card throughput">
    <div class="card-head"><h2>实时吞吐</h2><span class="note" id="tpNote">经隧道</span></div>
    <div class="rates">
      <div class="rate dn"><div class="cap">↓ 下行</div><div class="val"><span id="dnRate">0</span><span class="unit" id="dnUnit">B/s</span></div></div>
      <div class="rate up"><div class="cap">↑ 上行</div><div class="val"><span id="upRate">0</span><span class="unit" id="upUnit">B/s</span></div></div>
    </div>
    <div class="chart"><span class="scale" id="chartScale">—</span><svg id="mainSpark" viewBox="0 0 100 40" preserveAspectRatio="none">
      <line x1="0" y1="20" x2="100" y2="20" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="2 4" vector-effect="non-scaling-stroke"/>
      <g id="dnPaint"></g>
      <path id="upLine" fill="none" style="stroke:var(--up)" stroke-width="1" stroke-opacity=".85" stroke-linejoin="round" vector-effect="non-scaling-stroke" d=""/>
    </svg></div>
    <div class="totals">
      <span><span id="dnTotalCap">本次</span> ↓ <b id="dnTotal">0 B</b></span>
      <span><span id="upTotalCap">本次</span> ↑ <b id="upTotal">0 B</b></span>
      <span>连接 <b id="connCount">0</b></span>
    </div>
  </section>

  <section class="card probes">
    <div class="card-head"><h2>通道探测</h2><span class="dg" id="dgChip" data-s="idle">—</span></div>
    <div class="prow"><span class="nm">代理通道</span><span class="pill idle" id="pvPill">—</span><span class="res" id="pvRes">—</span></div>
    <div class="prow"><span class="nm">直连目标</span><span class="pill idle" id="pdPill">—</span><span class="res" id="pdRes">—</span></div>
    <div class="prow"><span class="nm">直连对照</span><span class="pill idle" id="pcPill">—</span><span class="res" id="pcRes">—</span></div>
    <div class="strip">
      <div class="lbl"><span>近 15 分钟</span><span id="stripStat">—</span></div>
      <svg id="stripSvg" viewBox="0 0 96 22" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <section class="card sites">
    <div class="card-head">
      <h2 id="siteTitle">站点</h2>
      <div class="sites-ops">
        <span class="note" id="siteNote">按域名归并 · 1s 采样</span>
        <button class="mini" id="addSiteBtn" type="button" title="添加要盯的域名">＋ 域名</button>
      </div>
    </div>
    <form class="site-form" id="siteForm" hidden>
      <input id="siteInput" name="domain" type="text" inputmode="url" aria-label="要监测的域名"
             placeholder="example.com · 回车添加，Esc 取消" autocomplete="off" spellcheck="false">
    </form>
    <div id="sites"></div>
    <div class="extras" id="extras"></div>
  </section>

  <footer>
    <span id="footLeft">—</span>
    <span id="footRight">—</span>
  </footer>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";

  const HIST = 120;
  const hist = { total: [], vpnSites: new Map() };
  let strip = [];
  let hostMode = false;
  let hostBytes = false;   // 本机模式且管理员权限 → 每行有真字节数（eStats）
  let probeStamp = "";
  let lastProbeTs = 0;
  let bought = 0;
  const rowCache = new Map();
  let lastPing = 0;
  const pageStart = Date.now();

  /* ── 格式化 ── */
  function split(v) {
    if (!v || v < 1) return ["0", "B"];
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0, n = v;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return [n >= 10 ? Math.round(n) : +n.toFixed(1), u[i]];
  }
  const fmtRate = v => { const [n, u] = split(v); return [n, u + "/s"]; };
  // 判定 → 曲线颜色：vpn/mixed 琥珀、direct 青、其它灰（历史按当时判定留色）
  const toneOf = a => (a === "vpn" || a === "mixed") ? "vpn" : a === "direct" ? "dir" : "dim";
  const fmtBytes = v => { const [n, u] = split(v); return n + " " + u; };
  const fmtMs = ms => (ms == null ? "—" : ms < 0 ? "不通" : ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(2) + " s");
  // 服务端把病因分好了类，这里只负责翻成人话（比显示 URLError 有用得多）
  const KIND_CN = { dns: "DNS 失败", refused: "拒绝连接", reset: "连接重置", timeout: "超时",
    unreach: "不可达", tls: "TLS 错误", http: "HTTP 错误", bind: "绑不上网卡",
    offline: "无网络", unknown: "未知" };
  const kindCn = k => KIND_CN[k] || "失败";
  const hhmmss = t => new Date(t * 1000).toLocaleTimeString("zh-CN", { hour12: false });
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ── 迷你曲线 ── */
  function buildPath(vals, w, h, max, close) {
    if (!vals.length) return "";
    const n = vals.length;
    const step = n > 1 ? w / (n - 1) : w;
    let d = "";
    for (let i = 0; i < n; i++) {
      const x = i * step;
      const y = (h - 2) - Math.min(1, vals[i] / max) * (h - 2.5);
      d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }
    if (close) d += `L${w} ${h - 2}L0 ${h - 2}Z`;
    return d;
  }

  const scales = new Map();
  function autoMax(key, peak, floor) {
    const prev = scales.get(key) || floor;
    const next = Math.max(floor, peak * 1.25, prev * 0.95);
    scales.set(key, next);
    return next;
  }

  const SVGNS = "http://www.w3.org/2000/svg";
  const TONE = {
    vpn: ["var(--vpn)", ".11"],   // 走隧道那几秒的琥珀
    dir: ["var(--dir)", ".10"],   // 直连
    dim: ["var(--dim-2)", ".05"], // 都不通
  };

  /* 颜色跟着"那一刻"走，不是跟着"此刻"走。
     VPN 关掉之后：琥珀不再长新点（新点按当时状态上色），旧点留在原地，
     窗口继续往前滚，于是那段曲线整体向左移出去 —— 而不是整条线瞬间变色或消失。 */
  function renderMainChart() {
    const h = hist.total;
    if (h.length < 2) return;
    let peak = 0;
    for (const p of h) peak = Math.max(peak, p.d, p.u);
    const max = autoMax("total", peak, 1024);
    const n = h.length, step = 100 / (n - 1);
    const yOf = v => (38 - Math.min(1, v / max) * 35.5).toFixed(2);

    // 只有 1 个采样点的孤立色带画不出线，并到邻居那边去（这也是"别拿一帧当结论"）
    const tones = h.map(p => TONE[p.s] ? p.s : "dim");
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < n; i++) {
        if (i > 0 && tones[i] === tones[i - 1]) continue;
        if (i < n - 1 && tones[i] === tones[i + 1]) continue;
        if (i > 0) tones[i] = tones[i - 1];
        else if (i < n - 1) tones[i] = tones[i + 1];
      }
    }

    const g = $("#dnPaint");
    while (g.firstChild) g.removeChild(g.firstChild);
    let start = 0;
    while (start < n) {
      const tone = tones[start];
      let end = start + 1;
      while (end < n && tones[end] === tone) end++;
      if (end - start >= 2) {
        const [col, alpha] = TONE[tone];
        let line = "", area = "";
        for (let i = start; i < end; i++) {
          const x = (i * step).toFixed(2);
          const y = yOf(h[i].d);
          line += (i > start ? "L" : "M") + x + " " + y;
          area += (i > start ? "L" : "M") + x + " " + y;
        }
        const xa = (start * step).toFixed(2), xb = ((end - 1) * step).toFixed(2);
        const a = document.createElementNS(SVGNS, "path");
        a.setAttribute("d", area + `L${xb} 38L${xa} 38Z`);
        a.setAttribute("fill", col);
        a.setAttribute("fill-opacity", alpha);
        g.appendChild(a);
        const l = document.createElementNS(SVGNS, "path");
        l.setAttribute("d", line);
        l.setAttribute("fill", "none");
        l.setAttribute("stroke", col);
        l.setAttribute("stroke-width", "1.4");
        l.setAttribute("stroke-linejoin", "round");
        l.setAttribute("vector-effect", "non-scaling-stroke");
        g.appendChild(l);
      }
      start = end;
    }

    const user = h.map(p => p.u), umax = Math.max(...user);
    $("#upLine").setAttribute("d", umax > max * 0.02 ? buildPath(user, 100, 40, max, false) : "");
    const [pn, pu] = fmtRate(Math.max(peak, umax));
    $("#chartScale").textContent = "峰值 " + pn + " " + pu;
  }

  /* ── 探测条 ── */
  function renderStrip() {
    const svg = $("#stripSvg");
    const n = 96, w = 100 / n, h = 22, bh = 14, y = (h - bh) / 2;
    let out = "";
    for (let i = 0; i < n; i++) {
      const s = strip[i];
      let fill = "#1b222c";
      if (s) fill = s.v ? "var(--ok)" : "var(--danger)"; else fill = "var(--line)";
      const x = (i * w).toFixed(3);
      out += `<rect x="${x}" y="${y}" width="${(w * 0.58).toFixed(3)}" height="${bh}" rx="0.9" style="fill:${fill}" opacity="${s ? 0.9 : 0.35}"></rect>`;
    }
    svg.innerHTML = out;
    const ok = strip.filter(s => s.v).length;
    const tail = probeStamp ? ` · ${probeStamp}` : "";
    $("#stripStat").textContent = strip.length ? `${ok}/${strip.length} 成功${tail}` : "采集中…";
  }

  // 软件里的节点名常带 node_12_ 前缀和 "| CM CU" 后缀，链路里只留认得出的部分
  function nodeLabel(n) {
    return (n || "").replace(/^node_\d+_/, "").split("|")[0].trim() || n || "";
  }

  function ago(ts) {
    const d = Date.now() / 1000 - ts;
    if (!ts || d < 0) return "";
    if (d < 60) return "刚刚";
    if (d < 3600) return Math.floor(d / 60) + " 分钟前";
    if (d < 86400) return Math.floor(d / 3600) + " 小时前";
    return Math.floor(d / 86400) + " 天前";
  }

  /* ── 站点行 ── */
  function ensureRow(key) {
    let r = rowCache.get(key);
    if (r) return r;
    const el = document.createElement("div");
    el.className = "site";
    el.innerHTML = `
      <div class="site-id">
        <span class="site-name">${esc(key)}</span>
        <span class="tag" data-via="idle">—</span>
        <button class="site-del" type="button" aria-label="移除这个域名" title="不再监测这个域名">×</button>
      </div>
      <div class="site-spark"><svg viewBox="0 0 100 30" preserveAspectRatio="none">
        <path class="f" fill="url(#gSite)" d=""/>
        <path class="a" fill="none" style="stroke:var(--dn)" stroke-width="1.3" stroke-linejoin="round" d=""/>
        <path class="b" fill="none" style="stroke:var(--up)" stroke-width="1" stroke-opacity=".8" stroke-linejoin="round" d=""/>
      </svg></div>
      <div class="site-nums">
        <span class="n dn"><i>↓</i><span class="d">0</span><span class="u">B/s</span></span>
        <span class="n up"><i>↑</i><span class="u2">0</span><span class="u">B/s</span></span>
      </div>`;
    $("#sites").appendChild(el);
    r = {
      el,
      tag: el.querySelector(".tag"),
      del: el.querySelector(".site-del"),
      a: el.querySelector("path.a"),
      b: el.querySelector("path.b"),
      f: el.querySelector("path.f"),
      d: el.querySelector(".n.dn .d"),
      u: el.querySelector(".n.up .u2"),
      du: el.querySelector(".n.dn .u"),
      uu: el.querySelector(".n.up .u"),
      dn: el.querySelector(".n.dn"),
      up: el.querySelector(".n.up"),
      title: key
    };
    rowCache.set(key, r);
    return r;
  }

  function renderSites(sites) {
    const seen = new Set();
    for (const s of sites) {
      const key = s.key === "other" ? "其他" : s.label;
      seen.add(key);
      const r = ensureRow(key);
      if (hostMode && !hostBytes) {
        // 本机模式、没管理员权限：行里是进程，只有连接数没有字节数 —— 数字位改成"5 条 / 3 远端"
        r.del.hidden = true;
        r.f.setAttribute("d", ""); r.a.setAttribute("d", ""); r.b.setAttribute("d", "");
        r.tag.dataset.via = "direct";
        r.tag.textContent = "本机";
        r.tag.hidden = true;      // 整张表都是本机进程，再挂个"本机"标签是废话
        r.d.textContent = s.conns || 0;
        r.du.textContent = "条";
        r.u.textContent = s.remotes || 0;
        r.uu.textContent = "远端";
        r.dn.classList.remove("idle");
        r.up.classList.remove("idle");
        r.el.title = `${s.label} · ${s.conns} 条连接 · ${s.remotes} 个远端`
          + (s.sample ? `\n例：${s.sample}` : "")
          + "\n本机模式不统计每行字节数（要客户端统计口或管理员权限）";
        continue;
      }
      const hk = s.fixed ? s.key : key;    // 固定行（经代理/直连）的历史按 key 存，和后端一致
      const removable = s.key !== "other" && !s.fixed;
      r.del.hidden = !removable;
      if (removable) r.del.onclick = ev => { ev.stopPropagation(); siteAction("remove", s.label); };
      hist.vpnSites.set(hk, hist.vpnSites.get(hk) || []);
      const q = hist.vpnSites.get(hk);
      q.push({ d: s.down, u: s.up });
      if (q.length > HIST) q.shift();

      let peak = 0;
      for (const p of q) peak = Math.max(peak, p.d, p.u);
      const max = autoMax(key, peak, 256);
      const dser = q.map(p => p.d), user = q.map(p => p.u);
      const dmax = Math.max(...dser), umax = Math.max(...user);
      const hasD = dmax > 0, hasU = umax > max * 0.02;
      r.f.setAttribute("d", hasD ? buildPath(dser, 100, 26, max, true) : "");
      r.a.setAttribute("d", hasD ? buildPath(dser, 100, 26, max, false) : "");
      r.b.setAttribute("d", hasU ? buildPath(user, 100, 26, max, false) : "");

      const via = s.via || "idle";
      const hue = via === "vpn" ? "var(--vpn)" : via === "direct" ? "var(--dir)"
        : via === "proxy" ? "var(--prox)" : "var(--dim-2)";
      r.a.style.stroke = hue;
      r.f.style.fill = via === "vpn" ? "rgba(217,154,78,.11)"
        : via === "direct" ? "rgba(95,173,165,.11)"
          : via === "proxy" ? "rgba(142,151,168,.10)" : "rgba(223,227,232,.05)";
      r.tag.dataset.via = via;
      r.tag.textContent = via === "vpn" ? "VPN" : via === "direct" ? "直连"
        : via === "proxy" ? "经客户端" : "空闲";
      // 本机模式下每行都是本机进程，"直连/空闲"标签是废话
      r.tag.hidden = hostMode || r.tag.textContent === s.label;
      const [dn, dnu] = fmtRate(s.down);
      const [up, upu] = fmtRate(s.up);
      r.d.textContent = s.down ? dn : "0";
      r.u.textContent = s.up ? up : "0";
      r.du.textContent = dnu;
      r.uu.textContent = upu;
      r.dn.classList.toggle("idle", !s.down);
      r.up.classList.toggle("idle", !s.up);
      r.el.title = s.fixed
        ? `${s.label} · 累计 ↓ ${fmtBytes(s.total_down)}  ↑ ${fmtBytes(s.total_up)}`
        : `${s.label} · ${s.conns} 条连接${s.ip ? " · " + s.ip : ""}${s.chain ? " · " + s.chain : ""}\n累计 ↓ ${fmtBytes(s.total_down)}  ↑ ${fmtBytes(s.total_up)}`;
      // 本机模式下这行有这么一部分是"进了客户端本地口"的：说清来源，
      // 也别说成"走了隧道"——入口字节里可能有一部分被规则直连放出去
      if (hostMode && s.px > 0) {
        r.el.title += `\n其中经过客户端本地口约 ${fmtRate(s.px)[0]} ${fmtRate(s.px)[1]}`
          + "（数的是它连本地代理口那条回环连接；入口字节，不代表都进了隧道）";
      }
    }
    for (const [key, r] of rowCache) {
      if (!seen.has(key)) { r.el.remove(); rowCache.delete(key); hist.vpnSites.delete(key); }
    }
    const box = $("#sites");
    let empty = box.querySelector(".sites-empty");
    if (!sites.length) {
      if (!empty) {
        empty = document.createElement("div");
        empty.className = "sites-empty";
        empty.textContent = hostMode
          ? "现在没有已建立的 TCP 连接（刚启动的话等一秒）"
          : "还没盯任何域名 —— 点右上角「＋ 域名」添加，或点下面的趋势标签";
        box.appendChild(empty);
      }
    } else if (empty) {
      empty.remove();
    }
  }

  /* ── 主渲染 ── */
  function render(s) {
    const now = Date.now();
    const cli = s.client || {};
    const isX = s.flow === "xray";
    const isHost = s.flow === "host";     // 没有代理客户端：网卡总量 + 谁在连谁
    hostMode = isHost;
    hostBytes = isHost && !!((s.host || {}).estats);
    // 分账：网卡总量 vs 经代理 —— 有客户端时两条路同时看
    const split = s.split || {};
    const px = split.proxy || null;       // 经代理（客户端统计口报的）
    const dr = split.direct || null;      // ≈ 网卡 − 经代理
    const pcl = split.client || null;      // 进客户端本地口的字节（不等于隧道，见下）
    lastPing = now;

    // 首次拿到快照时用服务端攒的历史打底，面板一打开就有曲线，而不是空等两分钟
    // （服务端历史不记"当时走哪条路"，打底色按当下的判定，不冒充过去的证据）
    const toneNow = toneOf((s.path || {}).active);
    if (!hist.seeded && s.hist) {
      hist.seeded = true;
      const toPairs = a => (a || []).slice(-HIST).map(x => ({ d: x[0], u: x[1], s: toneNow }));
      hist.total = toPairs(s.hist.total);
      for (const k in (s.hist.sites || {})) hist.vpnSites.set(k, toPairs(s.hist.sites[k]));
    }

    /* 判定 */
    const p = s.path || {};
    const active = p.active || "down";
    const vpnLane = active === "vpn" || active === "mixed";
    const node = s.node || {};
    const iface = s.iface || {};
    const eg = s.egress || {};
    const probes = s.probes || {};
    // 管理员下从回环口数到了"进客户端"的字节：数据来源以后端发布的 split 为准
    // （host 对象里不带宽带字段，别再自己猜）
    const pxHost = !!(split.src === "loop" && pcl);

    const vd = $("#verdict");
    vd.dataset.s = active;
    const label = { vpn: "走 VPN", direct: "直连", mixed: "部分走 VPN", down: "隧道读不到" }[active] || "未知";
    $("#verdictText").textContent = label;
    $("#verdictSub").textContent = active === "vpn" && node.name
      ? `${nodeLabel(node.name)} · ${eg.vpn_ip || "出口待测"}`
      : active === "mixed" ? "系统代理未开 · 仅显式代理的程序经隧道"
        : active === "direct" ? (eg.direct_ip || "") : "";
    if (isHost) {
      // 本机模式下的措辞以后端为准（p.brief）：可能真没在用隧道，
      // 也可能是客户端在转发、只是没给字节数 —— 后者绝不能写成"没在转发"（issue #1）
      const cliName = (s.client || {}).name || "";
      $("#verdictText").textContent = active === "mixed" ? "部分走 VPN" : "本机直连";
      $("#verdictSub").textContent = p.brief
        || (cliName ? (pxHost ? `${cliName} · 在转发 · 经它的本地口计数`
                              : `${cliName} · 读不到它的流量 · 按网卡统计`)
                    : "没检测到代理客户端 · 按网卡统计");
    }

    /* 路径 A：VPN */
    const route = s.route || {};
    const rv = route.vpn || {}, rd = route.direct || route.vpn || {};
    const lA = $("#laneVpn");
    lA.dataset.active = String(vpnLane);
    $("#vpnLocal").textContent = rv.ip || iface.ip || "—";
    $("#vpnNic").textContent = rv.ssid || rv.name || iface.ssid || iface.name || "—";
    $("#vpnNode").textContent = node.name ? nodeLabel(node.name)
      : (node.server ? shortServer(node.server) : "—");
    $("#vpnNode").title = node.server ? `${node.name || ""} ${node.server}:${node.port}`.trim() : "";
    $("#vpnExit").textContent = eg.vpn_ip || "待测";
    const conns = (s.tunnel || {}).conns || 0;
    const tn2 = s.tunnel || {};
    const isXray = isX;
    const host = s.host || {};
    // 没有连接表时"承载 N 条"和"rule 模式"都是空话，换成它真正能说的
    // 本机模式下连"隧道有没有承载"都读不到：只能说客户端是否在转发、字节数不可读
    const spServer = String((p.sysproxy || {}).server || "").split(";")[0].replace(/^[a-z]+=/, "");
    const head = isHost
      ? (active === "mixed"
          ? (pxHost ? `<span class="on">在转发 · 经本地口计数</span>`
                    : `<span class="on">在转发 · 字节数不可读</span>`)
          : `<span class="off">隧道未承载</span>`)
      : isXray
        ? `<span class="on">统计口 ${(cli.metrics || "").split(":")[1] || "—"}</span>`
        : `<span class="on">承载 ${conns} 条</span>`;
    const knobs = isHost
      ? (active === "mixed"
          ? `系统代理 → ${spServer || "客户端本地口"}`
          : `隧道未启用 · TUN ${tn2.tun ? "开" : "关"}`)
      : `${isXray ? (cli.name || "内核") : (cli.mode || "?")} · TUN ${tn2.tun ? "开" : "关"}`;
    const rtt = !node.rtt ? "" : node.rtt < 0 ? " · 节点超时" : ` · ${node.rtt}ms`;
    const pxRate = px ? ` · ↓${fmtRate(px.down)[0]} ${fmtRate(px.down)[1]}` : "";
    $("#vpnMeta").innerHTML = vpnLane
      ? `${head}${pxRate} · ${knobs}${rtt}`
      : `未承载流量${pxRate} · ${knobs}${rtt}`;

    /* 路径 B：直连 */
    const pd = probes.direct || {};
    const directLane = active === "direct" || active === "mixed";
    const lB = $("#laneDirect");
    lB.dataset.active = String(directLane);
    $("#dirLocal").textContent = rd.ip || iface.ip || "—";
    $("#dirNic").textContent = rd.ssid || rd.name || "—";
    $("#dirExit").textContent = eg.direct_ip || "待测";
    const drRate = dr ? `↓${fmtRate(dr.down)[0]} ${fmtRate(dr.down)[1]} · ` : "";
    $("#dirMeta").innerHTML = pd.ts
      ? (pd.ok ? `<span class="on">${drRate}目标可达 ${fmtMs(pd.ms)}</span>` : `<span class="off">${drRate}目标不通</span> · 对照 ${
          (probes.control || {}).ok ? fmtMs(probes.control.ms) : "不通"}`)
      : "探测中";

    const subU = cli.sub && cli.sub.updated ? ago(cli.sub.updated) : "";
    $("#modeNote").textContent = cli.name
      ? `${cli.name} · ${cli.core || "?"}${cli.version ? " " + cli.version : ""}`
        + `${cli.nodes ? " · " + cli.nodes + " 个节点" : ""}`
        + `${subU ? " · 订阅 " + subU + "更新" : ""}`
      : "未检测到代理客户端";
    vd.title = p.reason || "";

    /* 吞吐：大盘一律是"网卡总量"，因为那才是这台机器真实的流量；
       走没走代理由下面的分账和每一行的标签说清楚 */
    const t = split.nic || s.total || { down: 0, up: 0 };
    hist.total.push({ d: t.down, u: t.up, s: toneOf(active) });
    if (hist.total.length > HIST) hist.total.shift();
    const [dnv, dnu] = fmtRate(t.down);
    const [upv, upu] = fmtRate(t.up);
    $("#dnRate").textContent = dnv; $("#dnUnit").textContent = dnu;
    $("#upRate").textContent = upv; $("#upUnit").textContent = upu;
    renderMainChart();
    const tn = s.tunnel || {};
    const hcum = host.cum || { down: 0, up: 0 };
    $("#dnTotalCap").textContent = "本次";
    $("#upTotalCap").textContent = "本次";
    $("#dnTotal").textContent = fmtBytes(hcum.down);
    $("#upTotal").textContent = fmtBytes(hcum.up);
    $("#dnTotal").title = `自本面板启动以来这块网卡的累计下行`;
    $("#upTotal").title = `自本面板启动以来这块网卡的累计上行`;
    const pconns = tn.conns ?? 0;
    $("#connCount").textContent = isX ? "—" : (isHost ? (host.conns ?? 0) : pconns);
    $("#connCount").title = isHost
      ? "本机已建立的 TCP 连接数（不含回环）"
      : `经代理 ${pconns} 条 · 本机共 ${host.conns ?? 0} 条（不含回环）`;
    $("#siteNote").textContent = isHost
      ? (hostBytes ? "按进程归并 · 1s 采样 · 管理员权限" : "只数连接 · 不数字节（要管理员权限）")
      : isX ? "按出口归并 · 1s 采样" : "按域名归并 · 1s 采样";
    $("#siteTitle").textContent = isHost ? "进程" : "站点";
    // 没有连接表就没有逐域名数据：别让"＋ 域名"点了却永远没数
    $("#addSiteBtn").hidden = isX || isHost;
    $("#siteForm").hidden = isX || isHost;
    const rate = (o, k) => { const [v, u] = fmtRate((o || {})[k] || 0); return v + " " + u; };
    $("#tpNote").textContent = isHost
      ? (host.nic ? `本机网卡总量 · ${host.nic}` : "本机网卡总量")
        + (pcl ? ` · 经客户端 ${rate(pcl, "down")}` : "")
      : (px && dr)
        ? `经代理 ${rate(px, "down")} · 不走代理 ${rate(dr, "down")}`
        : (active === "down" ? "隧道未连接，网卡照数" : "网卡总量");
    $("#tpNote").title = isHost
      ? (pcl
        ? `经客户端（回环口 eStats，TCP）：↓${rate(pcl, "down")} ↑${rate(pcl, "up")}\n`
          + `  这是"应用 → 客户端本地口"的入口字节，其中多少进了隧道、\n`
          + `  多少被它的规则按直连放出去，客户端不给统计口就分不出来\n`
          + `网卡总量（含 UDP/QUIC）：↓${rate(t, "down")} ↑${rate(t, "up")}`
        : "")
      : `网卡总量（含 UDP/QUIC）：↓${rate(t, "down")} ↑${rate(t, "up")}\n`
        + `经代理：↓${rate(px, "down")} ↑${rate(px, "up")}\n`
        + `不走代理（估算）：↓${rate(dr, "down")} ↑${rate(dr, "up")}`;

    /* 探测 */
    const pv = probes.vpn || {}, pc = probes.control || {};
    setProbe("#pvPill", "#pvRes", pv, "代理→目标");
    setProbe("#pdPill", "#pdRes", pd, "直连→目标");
    setProbe("#pcPill", "#pcRes", pc, "直连→baidu");
    if (isHost && active !== "mixed") {
      // 没装/没开客户端时 7890 当然连不上，标红只会误导：这一路本来就没启用
      const pill = $("#pvPill");
      pill.className = "pill idle";
      pill.textContent = "未启用";
      pill.title = "没有代理客户端，这条通道不存在";
      $("#pvRes").textContent = "—";
    }
    probeStamp = pv.ts ? hhmmss(pv.ts).slice(0, 5) : "";
    // 诊断结论：一句"该怀疑谁"，完整推理放 tooltip，免得把排版挤爆
    const dg = s.diag || {};
    const chip = $("#dgChip");
    chip.dataset.s = dg.state || "idle";
    chip.textContent = dg.label || "—";
    chip.title = dg.label ? [dg.why, ...(dg.evidence || [])].filter(Boolean).join("\n") : "";

    if (pv.ts && pv.ts !== lastProbeTs) {
      lastProbeTs = pv.ts;
      strip.push({ v: !!pv.ok, d: !!pd.ok, t: pv.ts });
      if (strip.length > 96) strip.shift();
      renderStrip();
    }

    /* 站点 */
    // 本机模式的行是进程：管理员权限下每行有真字节数（eStats），
    // 就用和"站点"完全一样的那套行（曲线 + ↓↑ 速率）；普通权限只有连接数
    const procRows = (host.procs || []).map(p => ({
      key: p.name, label: p.name, conns: p.conns, remotes: p.remotes, sample: p.sample,
    }));
    renderSites(isHost ? (hostBytes ? (s.sites || []) : procRows) : (s.sites || []));
    const extras = s.extras || [];
    $("#extras").innerHTML = extras.length
      ? `<span class="ex-lbl">其他</span>` + extras.map(e =>
          `<button data-h="${esc(e.label)}" title="点击加入监测：${esc(e.label)}">＋ ${esc(e.label)}`
          + ` <b>${fmtRate(e.down)[0]}${fmtRate(e.down)[1]}</b></button>`).join("")
      : "";

    /* 页脚 */
    const nic = iface.kind === "wlan" ? `WLAN ${iface.ssid || ""}` : (iface.name || "网卡");
    let left = `${nic} · ${iface.ip || "?"}`;
    if (iface.kind === "wlan" && iface.band) {
      left += ` · ${iface.band} ${iface.channel ? "ch" + iface.channel : ""} · 信号 ${iface.signal || "?"}%`
        + (iface.rx ? ` · ${iface.rx}/${iface.tx} Mbps` : "");
    } else if (iface.gateway) {
      left += ` · 网关 ${iface.gateway}`;
    }
    if (route.dual) left += ` · 直连走 ${rd.name || "?"}${rd.ip ? " " + rd.ip : ""}`;
    $("#footLeft").textContent = left;
    $("#footRight").textContent = isHost
      ? `本机模式 · ${hostBytes ? (pcl ? "管理员：逐进程速率 + 经客户端字节" : "管理员：逐进程速率")
        : "普通权限：只数连接"}`
        + ` · ${hhmmss(s.ts || Date.now() / 1000)}`
      : `控制器 ${tn.controller || ""} · ${s.ok ? "在线" : "离线"} · ${hhmmss(s.ts || Date.now() / 1000)}`;
  }

  function shortServer(s) {
    if (!s) return "";
    const head = s.split(".")[0];
    return head.length > 17 ? head.slice(0, 16) + "…" : head;
  }

  function setProbe(pillSel, resSel, p, kind) {
    const pill = $(pillSel), res = $(resSel);
    if (!p || !p.ts) { pill.className = "pill idle"; pill.textContent = "—"; res.textContent = "—"; return; }
    const ok = !!p.ok;
    pill.className = "pill " + (ok ? "ok" : "bad");
    pill.textContent = ok ? (p.status || 200) : (p.kind ? kindCn(p.kind) : (p.err || "失败"));
    pill.title = ok ? "" : (p.detail || "");
    res.textContent = fmtMs(p.ms);
  }

  /* ── 监测域名增删 ── */
  let toastEl = null, toastTimer = 0;
  function toast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.id = "toast";
      toastEl.setAttribute("role", "status");
      toastEl.setAttribute("aria-live", "polite");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2000);
  }

  async function siteAction(action, domain) {
    try {
      const r = await fetch("/api/sites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, domain })
      });
      const j = await r.json();
      toast(j.msg || (j.ok ? "已更新" : "失败"));
      pull();
      return j;
    } catch (e) {
      toast("没连上本地服务");
    }
  }

  const siteForm = $("#siteForm"), siteInput = $("#siteInput");
  $("#addSiteBtn").onclick = () => {
    siteForm.hidden = !siteForm.hidden;
    if (!siteForm.hidden) siteInput.focus();
  };
  siteForm.onsubmit = async ev => {
    ev.preventDefault();
    const v = siteInput.value.trim();
    if (!v) return;
    siteInput.value = "";
    await siteAction("add", v);
    siteInput.focus();
  };
  siteInput.onkeydown = ev => {
    if (ev.key === "Escape") { siteForm.hidden = true; siteInput.blur(); }
  };
  $("#extras").onclick = ev => {
    const b = ev.target.closest("button[data-h]");
    if (b) siteAction("add", b.dataset.h);
  };

  /* ── 时钟 ── */
  let boot = 0;
  function tickClock() {
    const d = new Date();
    $("#clock").textContent = d.toLocaleTimeString("zh-CN", { hour12: false });
    if (boot) {
      const s = Math.max(0, Math.round((Date.now() - boot) / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      $("#uptime").textContent = h ? `已运行 ${h}h${String(m).padStart(2, "0")}m` : `已运行 ${m}m`;
    }
    // 采集器掉线（被 kill / 崩了 / 端口变了）：上一帧的判定不能继续冒充"现在"
    const silent = Date.now() - (lastPing || pageStart);
    const stale = silent > (lastPing ? 3500 : 6000);
    const ls = $("#linkState");
    if (ls) {
      ls.hidden = !stale;
      if (stale) {
        ls.textContent = lastPing
          ? "采集器未连接 · 最后 " + new Date(lastPing).toLocaleTimeString("zh-CN", { hour12: false })
          : "采集器未连接";
      }
    }
    document.body.classList.toggle("stale", stale);
    if (stale && !lastPing) $("#verdictText").textContent = "没连上采集器";
  }
  setInterval(tickClock, 1000);
  tickClock();

  /* ── 数据流 ── */
  function apply(s) {
    if (!s || !Object.keys(s).length) return;
    if (!boot && s.boot) boot = s.boot * 1000;
    render(s);
  }

  fetch("/api/state").then(r => r.json()).then(apply).catch(() => {});

  // 默认走 SSE；?poll=1 退化为 1s 轮询（SSE 被挡、或只想截图时用）
  const POLL = new URLSearchParams(location.search).has("poll");
  const pull = () => fetch("/api/state").then(r => r.json()).then(apply).catch(() => {});

  let es = null, retry = 0;
  function connect() {
    es = new EventSource("/api/stream");
    es.onmessage = e => { retry = 0; apply(JSON.parse(e.data)); };
    es.onerror = () => {
      es.close();
      retry = Math.min(retry + 1, 6);
      setTimeout(connect, 500 * retry + 500);
    };
  }
  if (POLL) { pull(); setInterval(pull, 1000); }
  else connect();
})();
</script>
</body>
</html>
